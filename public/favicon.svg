<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181513" />
      <stop offset="100%" stop-color="#0a0908" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="32" cy="32" r="22" fill="#f97316" fill-opacity="0.08" />

  <!-- Code Bracket Left < -->
  <path d="M19 22 L11 32 L19 42" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Code Bracket Right > -->
  <path d="M45 22 L53 32 L45 42" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Stylized Modern 'S' Developer Monogram -->
  <path d="M37 23.5 C36 21 31 21 28 23.5 C25 26 26 29 29.5 30.5 L34.5 33 C38.5 34.5 39.5 38 36.5 41 C33.5 43.5 27.5 43.5 26.5 40.5" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Small Glowing Dot Accent -->
  <circle cx="40" cy="40.5" r="2" fill="url(#accentGrad)" />
</svg>
